<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--blue); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--blue); color: #fff; display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 0 64px; box-sizing: border-box; gap: 40px; }
  .og .deco1 { position: absolute; width: 520px; height: 360px; right: -170px; bottom: -220px; background: rgb(255 255 255 / .07); border-radius: 130px 130px 16px 130px; }
  .og .brand { position: absolute; top: 48px; left: 64px; }
  .og .brand__mark { width: 56px; }
  .og .brand__name { font-size: 1.85rem; }
  .og .brand__sub { font-size: .95rem; }
  .og .brand__b1 { fill: #fff; }
  .og h1 { color: #fff; font-size: 86px; max-width: 9.5ch; margin-top: 40px; }
  .og h1 em { font-style: normal; color: var(--yellow); }
  .og p { margin-top: 22px; font-size: 26px; line-height: 1.4; color: var(--on-blue-2); max-width: 24ch; font-weight: 500; }
  .og .url { position: absolute; left: 64px; bottom: 44px; font-weight: 700; font-size: 22px; color: #fff; display: flex; gap: 10px; align-items: center; }
  .og .url span { display: inline-block; width: 16px; height: 12px; border-radius: 5px 5px 5px 1px; background: var(--yellow); }
  .vis { position: relative; width: 470px; height: 440px; }
  .vis .ph { position: absolute; inset: 10px 0 30px 40px; border-radius: 52px 52px 52px 8px; overflow: hidden; background: var(--yellow); }
  .vis .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%; filter: grayscale(1) contrast(1.15) brightness(1.08); mix-blend-mode: multiply; }
  .vis .b1 { position: absolute; right: -14px; top: -10px; width: 130px; height: 100px; border-radius: 32px 32px 32px 6px; background: var(--sky); }
  .vis .b2 { position: absolute; left: 0; bottom: 0; width: 210px; height: 150px; border-radius: 30px 30px 6px 30px; background: var(--peach); }
  .vis .tag { position: absolute; left: -10px; bottom: 40px; z-index: 2; background: #fff; color: var(--ink); border-radius: 24px 24px 24px 4px; padding: 14px 22px; font-weight: 900; font-size: 28px; letter-spacing: -.02em; line-height: 1.1; box-shadow: 0 24px 40px -22px rgb(0 0 0 / .55); }
  .vis .tag .s { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0; color: var(--ink-2); margin-top: 4px; }
</style></head>
<body>
<div class="og">
  <div class="deco1"></div>
  <span class="brand brand--light">
    <svg class="brand__mark" viewBox="0 0 48 38" aria-hidden="true"><path class="brand__b1" d="M11 0H19A11 11 0 0 1 30 11V15A11 11 0 0 1 19 26H0V11A11 11 0 0 1 11 0Z"/><path class="brand__b2" d="M29 12H37A11 11 0 0 1 48 23V38H29A11 11 0 0 1 18 27V23A11 11 0 0 1 29 12Z"/><path class="brand__b3" d="M29 12H30V15A11 11 0 0 1 19 26H18V23A11 11 0 0 1 29 12Z"/></svg>
    <span><span class="brand__name">Poradna <span>KL</span></span><span class="brand__sub">bezplatná poradna v Kladně</span></span>
  </span>
  <div>
    <h1><em>Bezplatná</em> poradna v&nbsp;Kladně</h1>
    <p>Nájem, dluhy, sociální dávky. Srozumitelně a zdarma.</p>
  </div>
  <div class="vis">
    <span class="b1"></span><span class="b2"></span>
    <div class="ph"><img src="../../assets/img/web/hero-1400.jpg" alt=""></div>
    <div class="tag">Ozveme se vám<span class="s">do 5 pracovních dnů</span></div>
  </div>
  <div class="url"><span></span>poradnakl.cz</div>
</div>
</body></html>
