<!doctype html>
<html lang="cs" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>Rada na dosah – web je v přípravě</title>
<meta name="description" content="Bezplatná právní poradna na Kladně. Web je v přípravě.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8E1B3E">
<meta property="og:title" content="Rada na dosah – bezplatná poradna na Kladně">
<meta property="og:image" content="{{site}}/assets/img/og.jpg">
<link rel="icon" href="{{asset:assets/img/favicon.svg}}" type="image/svg+xml">
<link rel="preload" href="{{asset:assets/fonts/satoshi-900.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset:assets/css/site.css}}">
<style>
  body { min-height: 100svh; display: grid; padding: var(--edge); background: var(--paper); }
  .soon { position: relative; overflow: hidden; display: grid; place-content: center; justify-items: center; gap: clamp(28px, 4vw, 44px); min-height: calc(100svh - 2 * var(--edge)); padding: 48px clamp(20px, 5vw, 64px); border-radius: var(--r-panel); background: var(--blue); color: var(--on-blue); text-align: center; }
  .soon .brand { flex-direction: column; gap: 14px; text-align: center; }
  .soon .brand__mark { width: clamp(72px, 9vw, 104px); }
  .soon .brand__name { font-size: clamp(2rem, 1.5rem + 2vw, 3rem); }
  .soon .brand__sub { font-size: clamp(1rem, .9rem + .4vw, 1.25rem); }
  .soon h1 { color: var(--on-blue); font-size: clamp(1.75rem, 1.3rem + 2vw, 3rem); line-height: 1.1; }
  .soon h1 em { font-style: normal; color: var(--yellow); }
</style>
</head>
<body>
<main class="soon">
  <span class="brand brand--light">
    {{logo}}
    <span><span class="brand__name">Rada <span>na dosah</span></span><span class="brand__sub">bezplatná poradna na Kladně</span></span>
  </span>
  <h1>Web je <em>v&nbsp;přípravě</em></h1>
</main>
</body>
</html>
